<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedChain AI</title>
<style>
:root{--bg:#fff;--sf:#faf6f1;--sf2:#f3ebe1;--bd:#e7ddd0;--br:#6b4a2f;--ac:#a47148;--tx:#2b2118;--mu:#8a7968;--rd:#b3412e;--am:#c98a2b;--gn:#4f7a4a}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Georgia,'Times New Roman',serif;color:var(--tx);background:var(--bg)}
h1,h2,h3,h4{margin:0;font-weight:600}.sans,button,input,select,textarea,table,.pill{font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:12px 24px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#fff;z-index:5;flex-wrap:wrap}
.brand{font-size:19px;color:var(--br);letter-spacing:.3px}.brand b{color:var(--ac)}
nav{display:flex;gap:4px}nav button{border:0;background:none;padding:8px 14px;border-radius:8px;color:var(--mu);cursor:pointer;font-size:13.5px}nav button.on{background:var(--sf2);color:var(--br);font-weight:600}
.ctl{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mu)}
select,input,textarea{border:1px solid var(--bd);border-radius:8px;padding:6px 9px;background:#fff;color:var(--tx);font-size:13px}textarea{width:100%;min-height:90px}
main{padding:22px 24px;max-width:1280px;margin:0 auto}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(107,74,47,.05)}.card.sf{background:var(--sf)}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1 1 280px}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.mu{color:var(--mu)}.sm{font-size:12px}.mt{margin-top:14px}.mb{margin-bottom:10px}
button.btn{border:1px solid var(--br);background:var(--br);color:#fff;border-radius:9px;padding:7px 14px;cursor:pointer;font-size:13px}button.btn.alt{background:#fff;color:var(--br)}button.btn.dn{background:var(--rd);border-color:var(--rd)}button.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11.5px;border:1px solid;white-space:nowrap}
.gn{color:var(--gn);border-color:#c5d8c1;background:#f2f7f1}.am{color:#9a6a14;border-color:#ecd5a8;background:#fdf6e7}.rd{color:var(--rd);border-color:#e9c1b8;background:#fcf1ee}.nu{color:var(--mu);border-color:var(--bd);background:var(--sf)}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;color:var(--mu);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--bd)}td{padding:7px 8px;border-bottom:1px solid var(--sf2);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover{background:var(--sf)}
.bar{height:7px;background:var(--sf2);border-radius:4px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%}
.tile{cursor:pointer;transition:.15s}.tile:hover{border-color:var(--ac)}.tile .n{font-size:26px;color:var(--br)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:5px 14px;cursor:pointer;color:var(--mu)}.tabs button.on{background:var(--br);color:#fff;border-color:var(--br)}
pre{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:11.5px;max-height:170px;overflow:auto;margin:6px 0;white-space:pre-wrap}
.ev{padding:5px 0;border-bottom:1px solid var(--sf2);font-size:12.5px;display:flex;gap:8px}.ev .t{color:var(--mu);min-width:62px}.ev.message{color:var(--br)}.ev.error{color:var(--rd)}
#drawer{position:fixed;top:0;right:-440px;width:420px;max-width:96vw;height:100vh;background:#fff;border-left:1px solid var(--bd);box-shadow:-6px 0 24px rgba(0,0,0,.07);transition:.25s;z-index:20;overflow:auto;padding:18px}#drawer.open{right:0}
.bell{position:relative;cursor:pointer;border:1px solid var(--bd);border-radius:9px;padding:5px 9px;background:#fff}.bell b{position:absolute;top:-7px;right:-7px;background:var(--rd);color:#fff;border-radius:99px;font:600 10px sans-serif;padding:2px 6px}
.nt{border:1px solid var(--bd);border-radius:10px;padding:9px 11px;margin-bottom:8px;border-left-width:4px}.nt.critical{border-left-color:var(--rd)}.nt.warning{border-left-color:var(--am)}.nt.info{border-left-color:var(--ac)}.nt.unread{background:var(--sf)}
.pulse{animation:p 1.2s infinite}@keyframes p{50%{opacity:.45}}
a{color:var(--ac)}.err{color:var(--rd)}details summary{cursor:pointer;color:var(--ac)}
svg text{font-family:'Segoe UI',system-ui,sans-serif}.node{cursor:pointer}
</style></head><body>
<header><div class="brand">Med<b>Chain</b> AI</div>
<nav id="nav"></nav>
<div class="ctl"><span>Scenario</span><select id="sc" onchange="chg()"></select><span>Budget (INR)</span><input id="bg" type="number" step="50000" style="width:110px" onchange="chg()"><span>Horizon</span><select id="wk" onchange="chg()"><option>2</option><option selected>4</option><option>6</option></select>
<div class="bell" onclick="toggleDrawer()" title="Notifications">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b4a2f" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/></svg><b id="bn" style="display:none">0</b></div></div></header>
<main id="main"></main>
<div id="drawer"></div>
<script>
const NAV=[['cc','Command Center'],['ws','Agent Workspace'],['sp','Supply & Traceability'],['da','Decisions & Audit']];
const AG=['demand','material','expiry','trace','recovery','guard'];
const LB={demand:'Demand Forecasting',material:'Material Risk',expiry:'Expiry & Inventory',trace:'Production & Traceability',recovery:'Recovery Planning',guard:'Quality Guard'};
const IC={demand:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',material:'<path d="M12 3l9 5v8l-9 5-9-5V8zM3 8l9 5 9-5M12 13v8"/>',expiry:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',trace:'<path d="M4 5h5v5H4zM15 5h5v5h-5zM9.5 15h5v5h-5zM6.5 10v2.5h11V10M12 12.5V15"/>',recovery:'<path d="M4 12a8 8 0 0 1 14-5M20 4v4h-4M20 12a8 8 0 0 1-14 5M4 20v-4h4"/>',guard:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4"/>'};
const POS={demand:[150,80],material:[380,45],expiry:[610,80],trace:[610,380],recovery:[380,415],guard:[150,380]};
const DEPS={material:['demand'],expiry:['demand','material'],trace:['material','expiry'],recovery:['demand','material','expiry','trace'],guard:['recovery']};
const STC={idle:'#b8a99a',waiting:'#c98a2b',analyzing:'#6b4a2f',completed:'#4f7a4a',attention:'#c98a2b',blocked:'#b3412e'};
const G={tab:'cc',sc:'combined',budget:1000000,weeks:4,A:null,meta:null,run:null,ev:[],since:0,sel:'demand',filt:'all',recs:[],sub:'inv',tq:'',tr:null,dmed:null,nf:{items:[],unread:0},auditF:{}};
const $=s=>document.getElementById(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=v=>'Rs '+Math.round(v).toLocaleString('en-IN');
async function api(p,b){const r=await fetch(p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
const pc=s=>({Released:'gn',Approved:'gn',pass:'gn',PASS:'gn',sent:'gn',approved:'gn',Low:'gn',OK:'gn',completed:'gn',Quarantine:'am',Conditional:'am',REVIEW:'am',warn:'am',Medium:'am','Near expiry':'am',pending:'am',failed:'rd',Rejected:'rd',Suspended:'rd',Expired:'rd',BLOCKED:'rd',fail:'rd',High:'rd',rejected:'rd'}[s]||'nu');
const pill=s=>`<span class="pill ${pc(s)}">${esc(s)}</span>`;
const ico=(k,sz=20,c='#6b4a2f')=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;

function donut(p,lbl){const r=44,c=2*Math.PI*r,col=p>=75?'#4f7a4a':p>=50?'#c98a2b':'#b3412e';return `<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#f3ebe1" stroke-width="11"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="11" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 60 60)" stroke-linecap="round"/><text x="60" y="58" text-anchor="middle" font-size="26" fill="#2b2118">${p}</text><text x="60" y="76" text-anchor="middle" font-size="10" fill="#8a7968">${lbl}</text></svg>`}
function line(it){const W=520,H=170,P=28,h=it.history,n=h.length,tot=n+4,mx=Math.max(...h,it.level,it.high/4*1.0,10)*1.15;const X=i=>P+i*(W-P-8)/(tot-1),Y=v=>H-20-v/mx*(H-34);
 const pts=h.map((v,i)=>X(i)+','+Y(v)).join(' ');const f=[X(n-1)+','+Y(h[n-1]),X(n+3)+','+Y(it.level)].join(' ');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%"><rect x="${X(n-1)}" y="8" width="${X(tot-1)-X(n-1)}" height="${H-28}" fill="#faf6f1"/><line x1="${P}" y1="${Y(it.baseline)}" x2="${W-8}" y2="${Y(it.baseline)}" stroke="#e7ddd0" stroke-dasharray="4 4"/><polyline points="${pts}" fill="none" stroke="#6b4a2f" stroke-width="2"/><polyline points="${f}" fill="none" stroke="#a47148" stroke-width="2" stroke-dasharray="5 4"/>${h.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="#6b4a2f"/>`).join('')}<text x="${W-8}" y="${Y(it.level)-6}" text-anchor="end" font-size="10.5" fill="#a47148">forecast ${it.level}k/wk</text><text x="${P}" y="${H-4}" font-size="10" fill="#8a7968">12 weeks of history (thousand tablets/wk), then forecast</text></svg>`}
const bar=(v,max,col='#a47148')=>`<div class="bar"><i style="width:${Math.min(100,v/max*100)}%;background:${col}"></i></div>`;

/* ---------------- data loading */
async function refresh(){G.A=await api(`/api/analysis?scenario=${G.sc}&budget=${G.budget}&weeks=${G.weeks}`);G.tr=null;if(G.tq)G.tr=await api(`/api/trace?scenario=${G.sc}&q=${encodeURIComponent(G.tq)}`);await loadRecs();await loadNotes();render()}
async function loadRecs(){G.recs=await api('/api/recs')}
async function loadNotes(){G.nf=await api('/api/notifications');const b=$('bn');b.style.display=G.nf.unread?'':'none';b.textContent=G.nf.unread;if($('drawer').classList.contains('open'))drawer()}
async function chg(){G.sc=$('sc').value;G.budget=+$('bg').value||1000000;G.weeks=+$('wk').value;G.run=null;G.ev=[];await refresh();if(G.tab==='ws')startRun()}
function go(t){G.tab=t;render()}
function render(){$('nav').innerHTML=NAV.map(([k,l])=>`<button class="${G.tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 if(!G.A){$('main').innerHTML='<p class="mu">Loading...</p>';return}
 ({cc:rCC,ws:rWS,sp:rSP,da:rDA})[G.tab]()}

/* ---------------- Command Center */
function rCC(){const A=G.A,F=A.F,D=F.demand.items,M=F.material,E=F.expiry,T=F.trace,pend=G.recs.filter(r=>r.status==='pending');
 const flagged=D.filter(i=>i.pattern!=='normal'||i.stockout_risk==='High');const topS=[...M.suppliers].sort((a,b)=>b.risk-a.risk)[0];
 if(!G.dmed||!D.find(i=>i.med===G.dmed))G.dmed=(flagged[0]||D[0]).med;const it=D.find(i=>i.med===G.dmed);
 const tile=(t,n,sub,tab,sv)=>`<div class="card tile" onclick="${tab}"><div class="sm mu">${t}</div><div class="n">${n}</div><div class="sm">${pill(sv)} ${sub}</div></div>`;
 $('main').innerHTML=`<div class="row"><div class="card sf" style="flex:1 1 380px;display:flex;gap:16px;align-items:center">${donut(A.health,'health')}<div><h3>${esc(G.meta.scenarios[G.sc].name)}</h3><p class="mu sm" style="margin:6px 0 10px">${esc(G.meta.scenarios[G.sc].desc)}</p><button class="btn" onclick="G.tab='ws';render();startRun()">Run agents on this scenario</button></div></div>
 <div class="g4" style="flex:2 1 560px">${tile('Demand risk',flagged.length,flagged.map(i=>i.name.split(' ')[0]).join(', ')||'stable',"go('ws')",flagged.length?'High':'Low')}
 ${tile('Supplier risk',topS.risk,esc(topS.name.split(' ')[0])+(topS.delay_days?' delayed':''),"G.sub='sup';go('sp')",topS.level)}
 ${tile('Expiry / inventory',inr(E.wastage_value),'projected wastage',"G.sub='inv';go('sp')",E.risk)}
 ${tile('Production impact',T.affected_batches.length+T.delayed_orders.length,T.affected_batches.length+' batches, '+T.delayed_orders.length+' orders',"G.sub='prod';go('sp')",T.affected_batches.length?'High':T.delayed_orders.length?'Medium':'Low')}</div></div>
 <div class="row mt"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h4>Demand and forecast</h4><div class="tabs sans" style="margin:0">${D.map(i=>`<button class="${i.med===G.dmed?'on':''}" onclick="G.dmed='${i.med}';render()">${esc(i.name.split(' ')[0])}</button>`).join('')}</div></div>${line(it)}
 <div class="sm mu">Level ${it.level}k vs baseline ${it.baseline}k (z ${it.z}); cover ${it.cover_weeks} wk; ${pill(it.pattern==='normal'?it.stockout_risk:it.pattern)} replenish ${it.replenish_k}k units (${it.required_kg} kg API). Band ${it.low}-${it.high}k over ${G.weeks} wk.</div></div>
 <div class="card"><h4 class="mb">Supplier risk</h4>${M.suppliers.map(s=>`<div style="display:flex;gap:8px;align-items:center;margin:7px 0"><span style="width:150px" class="sm">${esc(s.name)}</span>${bar(s.risk,100,s.level==='High'?'#b3412e':s.level==='Medium'?'#c98a2b':'#4f7a4a')}<span class="sm" style="width:30px">${s.risk}</span></div>`).join('')}</div></div>
 <div class="row mt"><div class="card"><h4 class="mb">High-priority alerts</h4>${A.alerts.filter(a=>a.sev!=='info').slice(0,7).map(a=>`<div class="nt ${a.sev} sans sm">${esc(a.msg)}</div>`).join('')||'<p class="mu sm">No alerts in this scenario.</p>'}</div>
 <div class="card"><h4 class="mb">Workflows and approvals</h4>${pend.length?`<p class="sm">${pend.length} pending approval(s)</p>`:'<p class="mu sm">No pending approvals.</p>'}${G.recs.slice(0,5).map(r=>`<div class="sm" style="padding:5px 0;border-bottom:1px solid #f3ebe1">${r.id} ${esc(r.scenario)} ${pill(r.status)} ${pill(r.guard_status)}</div>`).join('')}<button class="btn alt mt" onclick="go('da')">Open decisions</button></div>
 <div class="card"><h4 class="mb">Recent notifications</h4>${G.nf.items.slice(0,5).map(nt).join('')||'<p class="mu sm">None yet. Run the agents.</p>'}</div></div>`}
const nt=n=>`<div class="nt ${n.sev} ${n.read?'':'unread'} sans sm" onclick="nClick(${n.id},'${n.rec_id||''}')" style="cursor:pointer"><div style="display:flex;justify-content:space-between"><b>${esc(n.kind.replace(/_/g,' '))}</b><span class="mu">${n.ts.slice(11)}</span></div>${esc(n.msg)}${n.entity?` <span class="mu">[${esc(n.entity)}]</span>`:''}</div>`;

/* ---------------- Agent Workspace */
async function startRun(){G.ev=[];G.since=0;G.rec=null;G.run=await api('/api/run',{scenario:G.sc,budget:G.budget,weeks:G.weeks});G.since=G.run.seq;G.ev=G.run.events.slice();poll()}
async function poll(n=0){clearTimeout(G.pt);if(!G.run)return;try{const v=await api(`/api/run/${G.run.id}?since=${G.since}`);G.run=v;G.since=v.seq;G.ev.push(...v.events);if(v.status!=='running'&&v.status!=='created'){await loadRecs();await loadNotes()}if(G.tab==='ws')rWS(true)}catch(e){return}
 const rec=G.recs.find(r=>r.id===G.run.rec_id);if(G.run.status==='running'||G.run.status==='created'||(G.run.status==='completed'&&!rec&&n<12))G.pt=setTimeout(()=>poll(n+1),400)}
function edge(a,b,act){const[A,B]=[POS[a]||[380,230],POS[b]];return `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="${act?'#6b4a2f':'#e7ddd0'}" stroke-width="${act?2.4:1.3}" ${a==='orchestrator'?'stroke-dasharray="3 5"':''}/>`}
function rWS(soft){const R=G.run,ag=R?R.agents:null;const st=k=>ag?ag[k].status:'idle';
 const msgs=G.ev.filter(e=>e.type==='message'&&e.agent!=='orchestrator').slice(-3);const act=(a,b)=>msgs.some(m=>m.agent===a&&m.data.to===b);
 let svg=`<svg viewBox="0 0 760 460" width="100%">`;AG.forEach(k=>svg+=edge('orchestrator',k,false));AG.forEach(k=>(DEPS[k]||[]).forEach(d=>svg+=edge(d,k,act(d,k)||(ag&&ag[d].progress===100&&st(k)==='analyzing'))));
 svg+=`<circle cx="380" cy="230" r="46" fill="#faf6f1" stroke="#6b4a2f" stroke-width="2" class="${R&&R.status==='running'?'pulse':''}"/><text x="380" y="226" text-anchor="middle" font-size="12" fill="#6b4a2f" font-weight="600">Orchestrator</text><text x="380" y="243" text-anchor="middle" font-size="10.5" fill="#8a7968">${R?R.status:'ready'}</text>`;
 AG.forEach(k=>{const[x,y]=POS[k],s=st(k),c=STC[s],p=ag?ag[k].progress:0;svg+=`<g class="node" onclick="G.sel='${k}';rWS()"><rect x="${x-88}" y="${y-31}" width="176" height="62" rx="12" fill="#fff" stroke="${c}" stroke-width="${G.sel===k?3:1.6}" ${s==='waiting'?'stroke-dasharray="5 4"':''} class="${s==='analyzing'?'pulse':''}"/><g transform="translate(${x-80},${y-22})">${ico(k,22,c)}</g><text x="${x-52}" y="${y-8}" font-size="11.5" fill="#2b2118" font-weight="600">${LB[k].length>20?LB[k].slice(0,19)+'.':LB[k]}</text><circle cx="${x-48}" cy="${y+6}" r="3.5" fill="${c}"/><text x="${x-40}" y="${y+9}" font-size="10.5" fill="#8a7968">${s}</text><rect x="${x-80}" y="${y+19}" width="160" height="4" rx="2" fill="#f3ebe1"/><rect x="${x-80}" y="${y+19}" width="${160*p/100}" height="4" rx="2" fill="${c}"/></g>`});svg+='</svg>';
 const k=G.sel,a=ag?ag[k]:null;
 const ev=G.ev.filter(e=>G.filt==='all'?true:G.filt==='msg'?e.type==='message':e.agent===k).slice(-60).reverse();
 const rec=R&&G.recs.find(r=>r.id===R.rec_id);
 $('main').innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><h3>Agent Workspace</h3><span class="mu sm">${esc(G.meta.scenarios[G.sc].name)} | budget ${inr(G.budget)} | ${G.weeks} wk horizon</span><button class="btn" style="margin-left:auto" onclick="startRun()" ${R&&R.status==='running'?'disabled':''}>${R?'Run again':'Start agent workflow'}</button></div>
 <div class="row"><div class="card" style="flex:2 1 560px">${svg}</div>
 <div class="card" style="flex:1 1 320px"><div style="display:flex;gap:8px;align-items:center">${ico(k,22)}<h4>${LB[k]}</h4>${pill(a?a.status:'idle')}</div><p class="sm mu">${esc(a?a.task:'Select Start to run the workflow.')}</p>
 ${a&&a.error?`<p class="err sm">${esc(a.error)}</p><button class="btn alt" onclick="retry('${k}')">Retry this agent</button>`:''}
 ${a&&a.summary.length?`<h4 class="sm mt">Findings</h4><ul class="sm" style="padding-left:18px;margin:4px 0">${a.summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}
 ${a&&a.input?`<details><summary class="sm">Input received</summary><pre>${esc(JSON.stringify(a.input,null,1))}</pre></details>`:''}${a&&a.output?`<details><summary class="sm">Structured output (handoff)</summary><pre>${esc(JSON.stringify(a.output,null,1))}</pre></details>`:''}</div></div>
 <div class="row mt"><div class="card"><div style="display:flex;gap:8px;align-items:center" class="mb"><h4>Live event stream</h4><div class="tabs sans" style="margin:0 0 0 auto">${[['all','All'],['msg','Messages'],['ag','Selected agent']].map(([f,l])=>`<button class="${G.filt===f?'on':''}" onclick="G.filt='${f}';rWS()">${l}</button>`).join('')}</div></div><div style="max-height:300px;overflow:auto" class="sans">${ev.map(e=>`<div class="ev ${e.type}"><span class="t">${e.t}</span><span>${e.type==='message'?'':`<b>${e.agent==='orchestrator'?'':esc(LB[e.agent]||e.agent)}</b> `}${esc(e.text)}${e.type==='message'&&e.data.payload?` <span class="mu">${esc(JSON.stringify(e.data.payload)).slice(0,110)}</span>`:''}</span></div>`).join('')||'<p class="mu sm">No events yet.</p>'}</div></div>
 <div class="card sf"><h4 class="mb">Human decision</h4>${decisionBox(rec,R)}</div></div>`}
async function retry(k){await api(`/api/run/${G.run.id}/retry`,{agent:k});poll()}
function decisionBox(rec,R){if(!R)return '<p class="mu sm">The recommendation appears here once the Quality Guard has validated it.</p>';if(!rec)return R.status==='failed'?`<p class="err sm">Workflow failed at ${esc(R.error)}. Retry the agent.</p>`:'<p class="mu sm">Agents are working...</p>';
 const P=rec.payload,Rc=P.recovery;return `<div class="sm"><b>${rec.id}</b> ${pill(rec.guard_status)} ${pill(rec.status)}<ul style="padding-left:18px">${Rc.summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>${Rc.actions.map(a=>`<div>P${a.p}. ${esc(a.text)}</div>`).join('')}<div class="mt">Cost ${inr(Rc.total_cost)} of ${inr(Rc.budget)}${bar(Rc.total_cost,Rc.budget)}</div>${P.guard.checks.filter(c=>c.result!=='pass').map(c=>`<div>${pill(c.result)} ${esc(c.check)}: ${esc(c.detail)}</div>`).join('')}</div>
 ${rec.status==='pending'?`<textarea id="c-${rec.id}" placeholder="Reviewer comment${rec.guard_status==='REVIEW'?' (required for REVIEW)':''}" style="min-height:50px;margin:10px 0"></textarea><button class="btn" ${rec.guard_status==='BLOCKED'?'disabled':''} onclick="decide('${rec.id}','approve')">Approve</button> <button class="btn dn" onclick="decide('${rec.id}','reject')">Reject</button> <button class="btn alt" onclick="decide('${rec.id}','revise')">Request revision</button> <button class="btn alt" onclick="go('da')">Edit emails</button>`:`<p class="sm">Decision: ${pill(rec.status)} ${esc(rec.exec_status||'')}</p>`}`}
async function decide(id,dec){const b={decision:dec,comment:($('c-'+id)||{}).value||''};const em=[];for(let i=0;$(`em-${id}-${i}-to`);i++){const d=G.recs.find(r=>r.id===id).payload.recovery.drafts[i];em.push({supplier_id:d.supplier_id,to:$(`em-${id}-${i}-to`).value,subject:$(`em-${id}-${i}-sub`).value,body:$(`em-${id}-${i}-body`).value})}if(em.length)b.emails=em;
 try{await api(`/api/rec/${id}/decide`,b)}catch(e){alert(e.message)}await loadRecs();await loadNotes();render()}

/* ---------------- Supply & Traceability */
function rSP(){const F=G.A.F,subs=[['inv','Inventory & expiry'],['sup','Suppliers'],['fefo','FEFO allocation'],['prod','Production impact'],['tr','Batch traceability']];let h='';
 if(G.sub==='inv')h=`<div class="card"><table><tr><th>Lot</th><th>Material</th><th>Supplier</th><th>Remaining</th><th>Expiry</th><th style="width:150px">Days to expiry</th><th>Quality</th><th>Expiry status</th><th>FEFO use</th></tr>${F.expiry.lots.map(l=>`<tr class="click" onclick="traceLot('${l.id}')"><td><b>${l.id}</b></td><td>${esc(G.A.F.material.materials.find(m=>m.api===l.api).api_name)}</td><td>${l.sup}</td><td>${l.remaining} kg</td><td>${l.exp_date}</td><td>${bar(Math.max(0,l.days),365,l.days<0?'#b3412e':l.days<=60?'#c98a2b':'#4f7a4a')}<span class="sm mu">${l.days} d</span></td><td>${pill(l.status)}</td><td>${pill(l.expiry_status)}</td><td>${l.alloc_kg?l.alloc_kg+' kg':'-'}</td></tr>`).join('')}</table><p class="sm mu">Click a lot to trace it to finished batches. Near-expiry stock ${F.expiry.near_qty} kg; projected wastage ${inr(F.expiry.wastage_value)}; expired write-off ${inr(F.expiry.expired_value)}.</p></div>`;
 if(G.sub==='sup')h=`<div class="row"><div class="card"><h4 class="mb">Supplier risk and history</h4><table><tr><th>Supplier</th><th>Risk</th><th>On-time (6 mo)</th><th>Rejection</th><th>Qualification</th><th>Open PO delay</th></tr>${F.material.suppliers.map(s=>`<tr><td>${s.id} ${esc(s.name)}<div class="sm mu">${s.city}</div></td><td>${pill(s.level)} ${s.risk}</td><td><svg width="70" height="22">${s.hist.map((v,i)=>`<rect x="${i*12}" y="${22-(v-.4)/.6*20}" width="9" height="${(v-.4)/.6*20}" fill="#a47148"/>`).join('')}</svg> ${(s.on_time*100).toFixed(0)}%</td><td>${(s.rej*100).toFixed(1)}%</td><td>${pill(s.audit)}</td><td>${s.delay_days?s.delay_days+' d':'-'}</td></tr>`).join('')}</table>
 <p class="sm mu mt">Supplier history informs ranking only. Every received lot still enters quarantine and requires incoming inspection and QC release.</p></div></div>
 ${Object.entries(F.material.ranking).map(([api,rk])=>`<div class="card mt"><h4>Budget-aware ranking: ${esc(F.material.materials.find(m=>m.api===api).api_name)} (shortfall ${F.material.shortages.find(s=>s.api===api).shortfall} kg, budget ${inr(G.budget)})</h4><table><tr><th>#</th><th>Supplier</th><th>Order</th><th>Cost</th><th>Coverage</th><th>Lead</th><th style="width:140px">Score</th><th></th></tr>${rk.map((r,i)=>`<tr><td>${i+1}</td><td>${r.sup} ${esc(r.name)} ${pill(r.audit)}</td><td>${r.qty_order} kg @ Rs ${r.price.toLocaleString('en-IN')}</td><td>${inr(r.cost)} ${r.within_budget?'':pill('over budget')}</td><td>${(r.coverage*100).toFixed(0)}%</td><td>${r.lead} d</td><td>${bar(r.total,100)}${r.total}</td><td><details><summary>why</summary><div class="sm">${Object.entries(r.comp).map(([k,v])=>`${k} ${v} x ${r.weights[k]}`).join(' | ')}<ul style="padding-left:16px;margin:4px 0">${r.reasons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></details></td></tr>`).join('')}</table></div>`).join('')||'<div class="card mt mu">No shortage in this scenario, so no sourcing ranking is needed.</div>'}`;
 if(G.sub==='fefo')h=`<div class="row"><div class="card"><h4 class="mb">FEFO allocation (earliest expiry first, released and unexpired only)</h4><table><tr><th>Material</th><th>Lot</th><th>Allocate</th><th>Expiry</th></tr>${F.expiry.allocations.map(a=>`<tr class="click" onclick="traceLot('${a.lot}')"><td>${a.api}</td><td>${a.lot}</td><td>${a.kg} kg</td><td>${a.exp_date} (${a.days} d)</td></tr>`).join('')}</table></div>
 <div class="card"><h4 class="mb">Excluded from production</h4>${F.expiry.excluded.map(e=>`<div class="sm" style="padding:5px 0">${pill('blocked')} <b>${e.lot}</b> ${e.kg} kg: ${esc(e.reason)}</div>`).join('')||'<p class="mu sm">None</p>'}<h4 class="mb mt">Projected wastage</h4>${F.expiry.wastage.map(w=>`<div class="sm">${w.lot}: ${w.kg} kg, ${inr(w.value)} (expires in ${w.days} d)</div>`).join('')||'<p class="mu sm">No near-expiry stock left unallocated.</p>'}</div></div>`;
 if(G.sub==='prod')h=`<div class="row"><div class="card"><h4 class="mb">Production orders at risk</h4>${F.trace.delayed_orders.map(o=>`<div class="sm" style="padding:6px 0">${pill('at risk')} <b>${o.order}</b> planned ${o.date}: shortfall ${o.shortfall_kg} kg, about ${o.delay_days_if_unmitigated} days delay if unmitigated</div>`).join('')||'<p class="mu sm">No planned order at risk.</p>'}</div>
 <div class="card"><h4 class="mb">Batches exposed to rejected lots</h4>${F.trace.affected.map(a=>`<div class="sm" style="padding:6px 0"><b>${a.lot}</b> to ${a.order} (${a.kg} kg): ${a.batches.length?a.batches.map(b=>`<a href="#" onclick="traceLot('${b}');return false">${b}</a>`).join(', '):a.state}</div>`).join('')||'<p class="mu sm">No rejected lots in this scenario.</p>'}</div></div>`;
 if(G.sub==='tr'){const ids=[...F.expiry.lots.map(l=>l.id),...G.A.batches.map(b=>b.id)];h=`<div class="card"><div style="display:flex;gap:8px"><input id="tq" placeholder="Lot or batch ID, e.g. L-AZI-102 or B-AZI-2402A" value="${esc(G.tq)}" style="flex:1" onkeydown="if(event.key==='Enter')doTrace()"><button class="btn" onclick="doTrace()">Trace</button></div><div class="sm mu mt">${ids.map(i=>`<a href="#" onclick="traceLot('${i}');return false">${i}</a>`).join(' | ')}</div><div id="gr" class="mt">${graph(G.tr)}</div></div>`}
 $('main').innerHTML=`<div class="tabs sans">${subs.map(([k,l])=>`<button class="${G.sub===k?'on':''}" onclick="G.sub='${k}';rSP()">${l}</button>`).join('')}</div>`+h}
async function traceLot(id){G.tq=id;G.tr=await api(`/api/trace?scenario=${G.sc}&q=${encodeURIComponent(id)}`);G.sub='tr';G.tab='sp';render()}
async function doTrace(){G.tq=$('tq').value;G.tr=await api(`/api/trace?scenario=${G.sc}&q=${encodeURIComponent(G.tq)}`);rSP()}
function graph(T){if(!T)return '<p class="mu sm">Search a raw-material lot (forward trace to finished batches) or a finished batch (backward trace to lots and suppliers).</p>';if(!T.found)return `<p class="err sm">No lot or batch matches "${esc(T.q)}".</p>`;
 const cols=[[],[],[],[]];T.nodes.forEach(n=>cols[n.col].push(n));const pos={};cols.forEach((c,ci)=>c.forEach((n,i)=>pos[n.id]=[70+ci*215,40+i*70]));const H=Math.max(...cols.map(c=>c.length))*70+20;
 const col=s=>/Rejected|Suspended|Expired/.test(s)?'#b3412e':/Quarantine|Conditional|hold/i.test(s)?'#c98a2b':'#4f7a4a';
 return `<svg viewBox="0 0 900 ${H}" width="100%">${T.edges.map(([a,b,l])=>{const A=pos[a],B=pos[b];return `<path d="M${A[0]+75},${A[1]} C${A[0]+120},${A[1]} ${B[0]-120+75},${B[1]} ${B[0]-75+75-0},${B[1]}" fill="none" stroke="#c9b9a6" stroke-width="1.5"/><text x="${(A[0]+B[0])/2+75}" y="${(A[1]+B[1])/2-4}" font-size="10" fill="#8a7968" text-anchor="middle">${esc(l)}</text>`}).join('')}${T.nodes.map(n=>{const[x,y]=pos[n.id];return `<g><rect x="${x-75}" y="${y-22}" width="150" height="44" rx="9" fill="#fff" stroke="${col(n.status)}" stroke-width="${n.id===T.q?3:1.5}"/><text x="${x}" y="${y-4}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2b2118">${esc(n.label)}</text><text x="${x}" y="${y+11}" text-anchor="middle" font-size="9.5" fill="#8a7968">${esc((n.sub||'').slice(0,26))}</text></g>`}).join('')}${['Supplier','Raw-material lot','Production order','Finished batch'].map((t,i)=>`<text x="${70+i*215}" y="12" text-anchor="middle" font-size="10" fill="#a47148">${t}</text>`).join('')}</svg><p class="sm mu">Order-level genealogy: every lot consumed by an order is linked to all batches of that order.</p>`}

/* ---------------- Decisions & Audit */
async function rDA(){const [em,au,ds]=await Promise.all([api('/api/emails'),api('/api/audit'+qs(G.auditF)),api('/api/datasets')]);G.ds=ds;const st=G.meta,pend=G.recs.filter(r=>r.status==='pending'),done=G.recs.filter(r=>r.status!=='pending');
 $('main').innerHTML=`<h3 class="mb">Pending approvals</h3>${pend.map(recCard).join('')||'<div class="card mu">Nothing pending. Start the agents in the Agent Workspace.</div>'}
 <div class="row mt"><div class="card"><h4 class="mb">Decided recommendations</h4>${done.map(r=>`<div class="sm" style="padding:6px 0;border-bottom:1px solid #f3ebe1"><b>${r.id}</b> ${esc(r.scenario)} ${pill(r.status)} ${r.exec_status?'<span class="mu">'+esc(r.exec_status)+'</span>':''}<div class="mu">${esc(r.comment||'')}</div></div>`).join('')||'<p class="mu sm">None yet.</p>'}</div>
 <div class="card"><h4 class="mb">Email delivery</h4><table><tr><th>Kind</th><th>To</th><th>Status</th><th>Tries</th><th></th></tr>${em.map(e=>`<tr><td>${e.kind}<div class="sm mu">${e.rec_id||''} ${e.ts.slice(11)}</div></td><td>${esc(e.to_addr)}</td><td>${pill(e.status)}${e.error?`<div class="sm err">${esc(e.error)}</div>`:''}</td><td>${e.attempts}</td><td>${e.status==='failed'?`<button class="btn alt" onclick="retryMail(${e.id})">Retry</button>`:''}</td></tr>`).join('')}</table></div></div>
 <div class="row mt"><div class="card"><h4 class="mb">Settings</h4><div class="sm mu mb">SMTP is ${st.smtp_configured?'configured':'<b class="err">not configured</b>: emails will be recorded as failed'}. Credentials are best kept in .env.</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" class="sans"><input id="s-rev" placeholder="Reviewer email" value="${esc(st.reviewer_email)}" style="grid-column:1/3"><input id="s-host" placeholder="SMTP host" value="${esc(st.smtp.host)}"><input id="s-port" placeholder="Port" value="${st.smtp.port}"><input id="s-user" placeholder="SMTP user" value="${esc(st.smtp.user)}"><input id="s-pw" type="password" placeholder="SMTP password (not shown)"><input id="s-from" placeholder="From address" value="${esc(st.smtp.sender)}"><select id="s-sec">${['starttls','ssl','none'].map(x=>`<option ${st.smtp.security===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="mt"><button class="btn" onclick="saveSet()">Save settings</button> <button class="btn alt" onclick="testMail()">Send test to reviewer</button></div>
 <h4 class="mt mb">Demand data (CSV upload)</h4><div class="sm mu mb">Columns: medicine_id,demand_k (weekly, oldest first, 6+ rows per medicine; IDs MED-PCM500, MED-AZI500, MED-MET500). ${st.custom_demand.length?'<b>Custom data active for '+st.custom_demand.join(', ')+'.</b>':'Bundled data active.'}</div>
 <input type="file" id="up" accept=".csv" onchange="upCsv(this)"> <button class="btn alt" onclick="upReset()">Restore bundled data</button> <a class="sm" href="/api/dataset?name=demand_upload_example_surge.csv">download an example upload</a>
 <h4 class="mt mb">Bundled datasets (fixed, synthetic, INR)</h4><table>${(G.ds||[]).map(x=>`<tr><td><a href="/api/dataset?name=${x.file}">${x.file}</a></td><td>${x.rows} rows</td><td class="sm mu">${esc(x.desc)}</td></tr>`).join('')}</table></div>
 <div class="card"><h4 class="mb">Notification history</h4><div style="max-height:300px;overflow:auto">${G.nf.items.map(nt).join('')||'<p class="mu sm">None</p>'}</div></div></div>
 <div class="card mt"><div style="display:flex;gap:8px;align-items:center" class="mb"><h4>Audit trail</h4><input id="af-r" placeholder="Recommendation ID" value="${esc(G.auditF.rec||'')}" style="margin-left:auto"><input id="af-s" placeholder="Supplier ID" value="${esc(G.auditF.supplier||'')}"><input id="af-t" placeholder="Event type" value="${esc(G.auditF.type||'')}"><button class="btn alt" onclick="filt()">Filter</button></div>
 <div style="max-height:380px;overflow:auto"><table><tr><th>Timestamp</th><th>Event type</th><th>Actor</th><th>Rec ID</th><th>Supplier</th><th>Outcome</th><th>Detail</th></tr>${au.map(a=>`<tr><td>${a.ts}</td><td>${a.event_type}</td><td>${esc(a.actor)}</td><td>${a.rec_id||''}</td><td>${a.supplier_id||''}</td><td>${pill(a.outcome)}</td><td class="sm">${esc(a.detail)}</td></tr>`).join('')}</table></div></div>`}
const qs=f=>{const p=Object.entries(f).filter(([,v])=>v).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');return p?'?'+p:''};
function filt(){G.auditF={rec:$('af-r').value,supplier:$('af-s').value,type:$('af-t').value};rDA()}
function recCard(r){const P=r.payload,R=P.recovery,pl=Object.entries(R.plans);return `<div class="card mb"><div style="display:flex;gap:10px;align-items:center"><h4>${r.id}</h4><span class="mu sm">${esc(G.meta.scenarios[r.scenario].name)}</span>${pill(r.guard_status)}<span style="margin-left:auto" class="sm">${inr(R.total_cost)} of ${inr(R.budget)}</span></div>
 <div class="row mt"><div><h4 class="sm">Prioritised actions</h4>${R.actions.map(a=>`<div class="sm">P${a.p}. ${esc(a.text)}</div>`).join('')||'<p class="mu sm">None</p>'}<h4 class="sm mt">Quality validation</h4>${P.guard.checks.map(c=>`<div class="sm">${pill(c.result)} ${esc(c.check)}: ${esc(c.detail)}</div>`).join('')}${P.guard.blocked.map(b=>`<div class="sm">${pill('blocked')} ${esc(b.action)}: ${esc(b.reason)}</div>`).join('')}</div>
 <div><h4 class="sm">Plan comparison</h4>${pl.map(([api,x])=>`<table><tr><th>${api}</th><th>Cover</th><th>Cost</th><th>Budget</th></tr>${x.plans.map(p=>`<tr ${p.id===x.chosen?'style="background:#faf6f1"':''}><td>${p.id}${p.id===x.chosen?' (chosen)':''} ${esc(p.label)}</td><td>${(p.coverage*100).toFixed(0)}%</td><td>${inr(p.cost)}</td><td>${p.within_budget?pill('fits'):pill('over')}</td></tr>`).join('')}</table><div class="sm mu">${x.why.map(esc).join('<br>')}</div>`).join('')||'<p class="mu sm">No procurement needed.</p>'}</div></div>
 <div class="sm mu mt">Rule-based agents: every number and check is a deterministic calculation.</div>
 ${R.drafts.map((d,i)=>`<details class="mt" open><summary>Supplier email ${i+1}: ${d.supplier_id} (sent only after approval; editable)</summary><input id="em-${r.id}-${i}-to" value="${esc(d.to)}" style="width:100%;margin:6px 0"><input id="em-${r.id}-${i}-sub" value="${esc(d.subject)}" style="width:100%"><textarea id="em-${r.id}-${i}-body" style="margin-top:6px">${esc(d.body)}</textarea></details>`).join('')}
 <textarea id="c-${r.id}" class="mt" placeholder="Reviewer comment${r.guard_status==='REVIEW'?' (required: validation needs review)':''}" style="min-height:50px"></textarea><div class="mt"><button class="btn" ${r.guard_status==='BLOCKED'?'disabled':''} onclick="decide('${r.id}','approve')">Approve and execute</button> <button class="btn dn" onclick="decide('${r.id}','reject')">Reject</button> <button class="btn alt" onclick="decide('${r.id}','revise')">Request revision</button></div></div>`}
async function retryMail(id){await api(`/api/email/${id}/retry`,{});await loadNotes();rDA()}
async function saveSet(){await api('/api/settings',{reviewer_email:$('s-rev').value,smtp_host:$('s-host').value,smtp_port:$('s-port').value,smtp_user:$('s-user').value,smtp_password:$('s-pw').value,smtp_from:$('s-from').value,smtp_security:$('s-sec').value});G.meta=await api('/api/meta');rDA()}
async function upCsv(el){const f=el.files[0];if(!f)return;try{await api('/api/upload/demand',{csv:await f.text()});G.meta=await api('/api/meta');await refresh();if(G.tab==='ws')startRun()}catch(e){alert(e.message)}}
async function upReset(){await api('/api/upload/demand',{reset:1});G.meta=await api('/api/meta');await refresh();if(G.tab==='ws')startRun()}
async function testMail(){await api('/api/email/test',{to:$('s-rev').value});await loadNotes();rDA()}

/* ---------------- notifications drawer */
function toggleDrawer(){$('drawer').classList.toggle('open');drawer()}
function drawer(){$('drawer').innerHTML=`<div style="display:flex;align-items:center" class="mb"><h3>Notifications</h3><button class="btn alt" style="margin-left:auto" onclick="readAll()">Mark all read</button> <button class="btn alt" onclick="toggleDrawer()" style="margin-left:6px">Close</button></div>${G.nf.items.map(nt).join('')||'<p class="mu">No notifications.</p>'}`}
async function readAll(){await api('/api/notifications/read',{all:1});await loadNotes()}
async function nClick(id,rec){await api('/api/notifications/read',{id});await loadNotes();if(rec){$('drawer').classList.remove('open');go('da')}}

(async()=>{G.meta=await api('/api/meta');$('sc').innerHTML=Object.entries(G.meta.scenarios).map(([k,v])=>`<option value="${k}" ${k===G.sc?'selected':''}>${esc(v.name)}</option>`).join('');$('bg').value=G.budget;await refresh();setInterval(loadNotes,5000)})();
</script></body></html>
